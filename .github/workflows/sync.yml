name: Bidirectional Selected File Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    # Always allow manual runs. On push, ignore sync-generated commits and branch deletions.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.deleted != true &&
        !contains(github.event.head_commit.message || '', '[repo-sync]')
      )

    runs-on: ubuntu-latest

    steps:
      # 1. Check out the source repository with history so push diffs can include deletions.
      - name: Checkout source repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # 2. Clone the destination repository using the PAT stored in SYNC_TOKEN.
      - name: Clone destination repository
        env:
          TOKEN: ${{ secrets.SYNC_TOKEN }}
          TARGET_REPO: ${{ secrets.SYNC_REPO }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${TOKEN:-}" ]]; then
            echo "ERROR: repository secret SYNC_TOKEN is missing."
            exit 1
          fi

          if [[ -z "${TARGET_REPO:-}" ]]; then
            echo "ERROR: repository secret SYNC_REPO is missing."
            exit 1
          fi

          if [[ ! "$TARGET_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "ERROR: SYNC_REPO must be in owner/repository format."
            exit 1
          fi

          git clone --quiet \
            "https://x-access-token:${TOKEN}@github.com/${TARGET_REPO}.git" \
            target

          git -C target config user.name "github-actions[bot]"
          git -C target config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 3. Copy additions/changes and propagate allowlisted deletions.
      - name: Synchronize approved files and deletions
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          SYNC_FILES: |
            .cline/rules/*
            .cline/*
            .cline/rules/**
            .github/copilot-instructions.md
            .github/workflows/sync.yml
            .github/workflows/sync.yaml
            README.md
        shell: bash
        run: |
          set -euo pipefail

          echo "========== SYNC DIAGNOSTICS =========="
          echo "Event: ${EVENT_NAME}"
          echo "Source commit: ${AFTER}"

          # A push compares the before/after commits. --no-renames deliberately
          # reports a rename as a deletion of the old path plus an addition of
          # the new path, allowing both sides of the rename to be synchronized.
          # Manual runs (and the first push to a branch) enumerate tracked files.
          if [[ "$EVENT_NAME" == "push" && -n "${BEFORE:-}" && ! "$BEFORE" =~ ^0+$ ]]; then
            MODE="push/changed paths (including deletions and both sides of renames)"
            mapfile -d '' -t CANDIDATE_FILES < <(
              git diff --no-renames --name-only -z --diff-filter=ACMRTD "$BEFORE" "$AFTER"
            )
          else
            MODE="manual/all tracked files (no deletion propagation)"
            mapfile -d '' -t CANDIDATE_FILES < <(git ls-files -z)
          fi

          mapfile -d '' -t TRACKED_FILES < <(git ls-files -z)
          echo "Mode: ${MODE}"
          echo "Tracked files in source checkout: ${#TRACKED_FILES[@]}"
          echo "Configured allowlist patterns:"

          mapfile -t PATTERNS <<< "$SYNC_FILES"
          for pattern in "${PATTERNS[@]}"; do
            [[ -z "$pattern" || "$pattern" =~ ^[[:space:]]*# ]] && continue
            echo "  ${pattern}"
          done

          echo "Candidate paths examined: ${#CANDIDATE_FILES[@]}"
          if (( ${#CANDIDATE_FILES[@]} > 0 )); then
            printf '  %s\n' "${CANDIDATE_FILES[@]}"
          fi

          COPY_COUNT=0
          DELETE_COUNT=0
          UNCHANGED_DELETE_COUNT=0

          for source_file in "${CANDIDATE_FILES[@]}"; do
            [[ -z "$source_file" ]] && continue

            # Match repository-root-relative paths against the allowlist.
            # These are Bash conditional patterns; '*' may match '/' as well.
            approved=false
            matched_pattern=""

            for pattern in "${PATTERNS[@]}"; do
              [[ -z "$pattern" || "$pattern" =~ ^[[:space:]]*# ]] && continue

              if [[ "$source_file" == $pattern ]]; then
                approved=true
                matched_pattern="$pattern"
                break
              fi
            done

            if [[ "$approved" == false ]]; then
              echo "DENY: ${source_file} (not in allowlist)"
              continue
            fi

            destination_file="target/${source_file}"

            if [[ -f "$source_file" || -L "$source_file" ]]; then
              mkdir -p "target/$(dirname "$source_file")"

              # Do not follow a pre-existing destination symlink when replacing
              # a selected file. Preserve source symlinks as symlinks in Git.
              if [[ -L "$destination_file" ]]; then
                rm -f -- "$destination_file"
              elif [[ -e "$destination_file" && ! -f "$destination_file" ]]; then
                echo "ERROR: destination path is not a regular file: ${source_file}"
                exit 1
              fi

              cp -pP -- "$source_file" "$destination_file"
              git -C target add -A -- ":(literal)${source_file}"
              COPY_COUNT=$((COPY_COUNT + 1))
              echo "COPY: ${source_file} (matched: ${matched_pattern})"
            else
              # The source path is absent: this is a deletion on a push.
              # Manual runs enumerate existing files only and do not enter here.
              if [[ -f "$destination_file" || -L "$destination_file" ]]; then
                rm -f -- "$destination_file"
                git -C target add -A -- ":(literal)${source_file}"
                DELETE_COUNT=$((DELETE_COUNT + 1))
                echo "DELETE: ${source_file} (matched: ${matched_pattern})"
              elif [[ -e "$destination_file" ]]; then
                echo "ERROR: destination path is a directory, not a file: ${source_file}"
                exit 1
              else
                UNCHANGED_DELETE_COUNT=$((UNCHANGED_DELETE_COUNT + 1))
                echo "DELETE SKIP: ${source_file} is already absent from destination"
              fi
            fi
          done

          echo "--------------------------------------"
          echo "Approved files copied: ${COPY_COUNT}"
          echo "Approved files deleted: ${DELETE_COUNT}"
          echo "Already absent at destination: ${UNCHANGED_DELETE_COUNT}"
          echo "======================================"

      # 4. Commit and push only if the destination actually changed.
      - name: Commit and push synchronized changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$(git -C target status --porcelain)" ]]; then
            echo "No approved file changes to synchronize."
            exit 0
          fi

          DESTINATION_BRANCH="$(git -C target branch --show-current)"
          if [[ -z "$DESTINATION_BRANCH" ]]; then
            echo "ERROR: could not determine the destination repository's checked-out branch."
            exit 1
          fi

          git -C target status --short
          git -C target commit -m "[repo-sync] Update approved files from ${GITHUB_REPOSITORY}@${GITHUB_SHA:0:7}"
          git -C target push origin "HEAD:${DESTINATION_BRANCH}"
