name: Bidirectional Selected File Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    # Allow manual runs. Skip pushes created by this workflow to prevent loops.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.deleted != true &&
        !contains(github.event.head_commit.message || '', '[repo-sync]')
      )

    runs-on: ubuntu-latest

    steps:
      # 1. Check out the source repository.
      - name: Checkout source repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # 2. Clone the destination repository.
      - name: Clone destination repository
        env:
          TOKEN: ${{ secrets.SYNC_TOKEN }}
          TARGET_REPO: ${{ secrets.SYNC_REPO }}
        run: |
          set -euo pipefail

          if [[ -z "${TOKEN}" || -z "${TARGET_REPO}" ]]; then
            echo "SYNC_TOKEN and SYNC_REPO must both be configured."
            exit 1
          fi

          git clone \
            "https://x-access-token:${TOKEN}@github.com/${TARGET_REPO}.git" \
            target

      # 3. Copy only approved files that changed in this push.
      #    A manual run copies all existing tracked files matching the allowlist.
      - name: Copy approved changed files
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          SYNC_FILES: |
            # Cline rules
            .cline/rules/*
            .cline/rules/**
          
            # GitHub Actions workflows
            .github/workflows/sync.yml
            .github/workflows/sync.yaml
          
            # Other files
            
        shell: bash
        run: |
          set -euo pipefail

          # On a push, get added/copied/modified/renamed/type-changed files.
          # On a manual run (or the first push), inspect all tracked files.
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then

            echo "Manual synchronization: inspecting all tracked files."
          
            mapfile -d '' -t CHANGED_FILES < <(
              git ls-tree -r -z --name-only "$AFTER"
            )
          
            echo "Tracked files under .cline/rules:"
            git ls-tree -r --name-only "$AFTER" -- .cline/rules
          
            echo "Total tracked files found: ${#CHANGED_FILES[@]}"
          
          else
          
            echo "Push synchronization: inspecting changed files."
          
            mapfile -d '' -t CHANGED_FILES < <(
              git diff --name-only -z --diff-filter=ACMRT "$BEFORE" "$AFTER"
            )
          
          fi

          # Convert path globs to regular expressions:
          #   *  matches within one path component (not across /)
          #   ** matches across path components, including /.
          #   ?  matches one character other than /.
          glob_to_regex() {
            local glob="$1"
            local regex='^'
            local i=0 char next

            while (( i < ${#glob} )); do
              char="${glob:i:1}"
              next="${glob:i+1:1}"

              case "$char" in
                '*')
                  if [[ "$next" == '*' ]]; then
                    regex+='.*'
                    i=$((i + 2))
                  else
                    regex+='[^/]*'
                    i=$((i + 1))
                  fi
                  ;;
                '?')
                  regex+='[^/]'
                  i=$((i + 1))
                  ;;
                '.'|'+'|'('|')'|'['|']'|'{'|'}'|'^'|'$'|'|')
                  regex+="\\${char}"
                  i=$((i + 1))
                  ;;
                *)
                  regex+="$char"
                  i=$((i + 1))
                  ;;
              esac
            done

            printf '%s$' "$regex"
          }

          # Read approved paths and compile their glob patterns once.
          mapfile -t PATTERNS <<< "$SYNC_FILES"
          declare -a PATTERN_REGEXES=()

          for pattern in "${PATTERNS[@]}"; do
            [[ -z "$pattern" || "$pattern" == \#* ]] && continue
            PATTERN_REGEXES+=("$(glob_to_regex "$pattern")")
          done

          for source_file in "${CHANGED_FILES[@]}"; do
            [[ -z "$source_file" ]] && continue

            # Match the changed path against the allowlist.
            approved=false

            for pattern_regex in "${PATTERN_REGEXES[@]}"; do
              if [[ "$source_file" =~ $pattern_regex ]]; then
                approved=true
                break
              fi
            done

            [[ "$approved" == false ]] && continue

            # Do not propagate deletions or missing source files.
            [[ ! -f "$source_file" ]] && continue

            # Create the destination directory and copy to the same relative path.
            mkdir -p "target/$(dirname "$source_file")"
            cp -p -- "$source_file" "target/$source_file"
            git -C target add -- "$source_file"

            echo "Synchronized: $source_file"
          done

      # 4. Commit and push staged changes to the destination's default branch.
      - name: Commit and push synchronized files
        run: |
          set -euo pipefail

          git -C target config user.name "github-actions[bot]"
          git -C target config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if git -C target diff --cached --quiet; then
            echo "No approved file changes to synchronize."
            exit 0
          fi

          TARGET_BRANCH="$(git -C target branch --show-current)"

          if [[ -z "$TARGET_BRANCH" ]]; then
            echo "Could not determine the destination's checked-out branch."
            exit 1
          fi

          git -C target commit -m "[repo-sync] Update approved files"
          git -C target push origin "HEAD:refs/heads/${TARGET_BRANCH}"

          echo "Synchronization completed successfully."

          echo "========== SYNC DIAGNOSTICS =========="

          echo "Event: $EVENT_NAME"
          echo "Source commit: $AFTER"
          
          echo ""
          echo "Files tracked in .cline:"
          git ls-tree -r --name-only "$AFTER" -- .cline/
          
          echo ""
          echo "README status:"
          if git cat-file -e "$AFTER:README.md" 2>/dev/null; then
          echo "README.md exists and is tracked."
          else
          echo "README.md is NOT tracked."
          fi
          
          echo ""
          echo "Files discovered for synchronization:"
          printf '%s\n' "${CHANGED_FILES[@]}"
          
          echo "======================================"
